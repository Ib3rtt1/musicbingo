{% block content %}
<div style="background-color: #34495e; padding: 40px; border-radius: 15px; max-width: 450px; margin: 50px auto; font-family: Arial; text-align: center; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
    <h2>🔒 Recuperar Contraseña</h2>
    <p style="color: #bdc3c7; font-size: 14px;">Ingresa el correo electrónico con el que te registraste y te enviaremos un enlace para cambiar tu clave.</p>
    
    <form method="POST" style="margin-top: 20px;">
        {% csrf_token %}
        <div style="margin-bottom: 20px; text-align: left;">
            {{ form.as_p }}
        </div>
        <button type="submit" style="background-color: #e74c3c; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer;">
            Enviar enlace de recuperación
        </button>
    </form>
</div>
{% endblock %}
