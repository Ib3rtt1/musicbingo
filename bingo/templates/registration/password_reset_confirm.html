{% block content %}
<div style="background-color: #34495e; padding: 40px; border-radius: 15px; max-width: 450px; margin: 50px auto; font-family: Arial; text-align: center; color: white;">
    <h2>🆕 Nueva Contraseña</h2>
    <p style="color: #bdc3c7;">Por favor, ingresa tu nueva contraseña dos veces para confirmarla.</p>
    
    {% if validlink %}
        <form method="POST" style="margin-top: 20px; text-align: left;">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="background-color: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px;">
                Guardar nueva contraseña
            </button>
        </form>
    {% else %}
        <p style="color: #e74c3c; font-weight: bold;">⚠️ El enlace de recuperación no es válido o ya ha expirado.</p>
        <a href="{% url 'reset_password' %}" style="color: white;">Solicitar un nuevo enlace</a>
    {% endif %}
</div>
{% endblock %}
