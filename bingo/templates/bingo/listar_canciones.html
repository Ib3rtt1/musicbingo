<div class="container" style="max-width: 900px; margin: 20px auto; font-family: Arial, sans-serif;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Gestión de Canciones</h1>
        <a href="{% url 'agregar_cancion' %}" style="background: #27ae60; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px;">+ Agregar canción</a>
    </div>
    <div class="nav-bar" style="margin-bottom: 20px; padding: 10px; background: #eee; border-radius: 5px;">
      <a href="{% url 'configurar_sala' %}" class="btn" style="background-color: #6c757d;">⬅️ Configurar Sala</a>
    </div>
    <div class="nav-bar" style="margin-bottom: 20px; padding: 10px; background: #eee; border-radius: 5px;">
         <a href="{% url 'home' %}" class="btn btn-outline-primary">Menú Principal</a>
    </div>
    
    <table width="100%" style="margin-top: 20px; border-collapse: collapse; background: white;">
        <thead>
            <tr style="background: #f8f9fa; border-bottom: 2px solid #dee2e6;">
                <th style="padding: 12px; text-align: left;">Nº</th>
                <th style="padding: 12px; text-align: left;">Nombre</th>
                <th style="padding: 12px; text-align: left;">Artista</th>
                <th style="padding: 12px; text-align: center;">Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for c in canciones %}
            <tr style="border-bottom: 1px solid #eee;">
                <td style="padding: 10px;">{{ c.numero }}</td>
                <td style="padding: 10px;">{{ c.nombre }}</td>
                <td style="padding: 10px;">{{ c.artista }}</td>
                <td style="padding: 10px; text-align: center;">
                    <a href="{% url 'editar_cancion' c.id %}" style="color: #007bff; margin-right: 8px;">Datos</a>
                    <a href="{% url 'subir_archivos' c.id %}" style="color: #6f42c1; margin-right: 8px;">Archivos</a>
                    <form action="{% url 'eliminar_cancion' c.id %}" method="POST" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" onclick="return confirm('¿Borrar {{ c.nombre }}?')" style="color: #dc3545; border: none; background: none; cursor: pointer; font-size: 14px;">Borrar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
