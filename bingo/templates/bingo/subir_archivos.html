<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subir Multimedia - Music Bingo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 8px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        .btn { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="card">
    <h2>Paso 2: Adjuntar archivos multimedia 🎞️</h2>
    <p style="color: #666; font-size: 16px;">
        Subiendo archivos para: <strong>{{ cancion.nombre }}</strong> de <em>{{ cancion.artista }}</em>
    </p>
    <hr>

    <!-- ⚠️ enctype="multipart/form-data" es obligatorio para transferir archivos pesados -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="archivo_mp4">🎞️ Archivo de Video o Audio (MP4):</label>
            <input type="file" name="archivo_mp4" id="archivo_mp4" accept="video/mp4, audio/*">
        </div>

        <div class="form-group">
            <label for="imagen">🖼️ Imagen de Portada:</label>
            <input type="file" name="imagen" id="imagen" accept="image/*">
        </div>

        <button type="submit" class="btn">Guardar y Finalizar</button>
    </form>
    
    <br>
    <a href="{% url 'home' %}" style="color: #999; text-decoration: none; display: block; text-align: center; font-size: 14px;">Omitir por ahora y volver al inicio</a>
</div>

</body>
</html>
