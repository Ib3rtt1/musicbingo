<div class="container mt-4">
    <div class="d-flex justify-content-between mb-4">
        <a href="{% url 'consola_juego' %}" class="btn btn-secondary">
            ← Volver a la Consola
        </a>
        <h2 class="text-center">Control de Cartones - {{ game.id }}</h2>
        <a href="{% url 'home' %}" class="btn btn-outline-primary">Menú Principal</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover border">
            <thead class="table-dark">
                <tr>
                    <th>Usuario</th>
                    <th>Código</th>
                    <th>Números (Canciones)</th>
                </tr>
            </thead>
            <tbody>
                {% for carton in cartones %}
                <tr>
                    <td><strong>{{ carton.user.username }}</strong></td>
                    <td>{{ carton.codigo }}</td>
                    <td>
                        {% for item in carton.songs.all %}
                            <span class="badge {% if item.song.id in canciones_cantadas %}bg-success{% else %}bg-secondary{% endif %}">
                                {{ item.song.numero }}
                            </span>
                        {% endfor %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<style>
    /* Estilos simples por si no usas Bootstrap */
    .badge { padding: 5px 10px; border-radius: 4px; margin: 2px; display: inline-block; }
    .bg-success { background-color: #28a745; color: white; text-decoration: line-through; }
    .bg-secondary { background-color: #6c757d; color: white; }
</style>

<script>
    // Se refresca la página cada 5 segundos (5000 milisegundos)
    setInterval(function() {
        location.reload();
    }, 5000);
</script>
