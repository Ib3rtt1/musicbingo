<form method="POST">
    {% csrf_token %}
    <h2>Configurar Nueva Sala</h2>
    
    <div style="margin-bottom: 15px;">
        <input type="text" name="nombre_sala" placeholder="Nombre de la partida" required style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 15px;">
        <label>Tamaño del cartón:</label>
        <input type="number" name="tamano_carton" value="15" min="5" max="25" style="padding: 8px;">
    </div>

    <div style="margin-bottom: 15px;">
        <label>Total de canciones en esta partida:</label>
        <input type="number" name="limite_canciones" value="90" min="1" max="500" required style="padding: 8px;">
    </div>

    <button type="submit" style="padding: 10px 20px; background-color: #27ae60; color: white; border: none; cursor: pointer;">
        Iniciar Nueva Partida
    </button>

    <div class="nav-bar" style="margin-top: 20px; padding: 10px; background: #eee; border-radius: 5px;">
        <a href="{% url 'home' %}" class="btn">🏠 Volver al Home</a>
    </div>
</form>
