<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Cartón de Bingo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; text-align: center; padding: 40px; }
        
        .carton-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 900px;
            margin: 0 auto;
        }

        /* 🎲 La magia del grid: 5 columnas iguales */
        .grid-carton {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .casilla {
            background-color: #f8f9fa;
            border: 3px solid #dee2e6;
            border-radius: 10px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 120px;
            transition: 0.2s;
        }

        .casilla:hover { border-color: #007bff; transform: scale(1.02); }

        .numero-cancion {
            font-size: 32px;
            font-weight: 900;
            color: #dc3545;
            margin-bottom: 5px;
        }

        .nombre-cancion {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .artista-cancion {
            font-size: 12px;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <div class="carton-container">
        <h1>🎟️ Cartón de {{ user.username|upper }} 🎟️</h1>
        <hr>

        <div class="grid-carton">
            {% for casilla in casillas %}
                <div class="casilla">
                    <div class="numero-cancion">{{ casilla.song.numero }}</div>
                    <div class="nombre-cancion">{{ casilla.song.nombre }}</div>
                    <div class="artista-cancion">{{ casilla.song.artista }}</div>
                </div>
            {% endfor %}
        </div>
        
        <br>
        <a href="{% url 'home' %}" style="color: #666; text-decoration: none;">Volver al inicio</a>
    </div>

</body>
</html>
